<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CrossUsage">
  <defs>
    <linearGradient id="cu-plate" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191c24"/>
      <stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="cu-jade" x1="19" y1="45.5" x2="50" y2="58.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="cu-led" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(72.5 67.5) rotate(45) scale(10)">
      <stop stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#e04819"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#cu-plate)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Top quota track -->
  <rect x="19" y="25" width="62" height="13.5" rx="6.75" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="19" y="25" width="44" height="13.5" rx="6.75" fill="#faf8f4"/>

  <!-- Middle telemetry track -->
  <rect x="19" y="44.5" width="62" height="13.5" rx="6.75" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="19" y="44.5" width="31" height="13.5" rx="6.75" fill="url(#cu-jade)"/>

  <!-- Bottom signal track + vermilion LED -->
  <rect x="19" y="64" width="41" height="10" rx="5" fill="#ffffff" fill-opacity="0.24"/>
  <circle cx="74" cy="69" r="6.75" fill="url(#cu-led)"/>
</svg>
